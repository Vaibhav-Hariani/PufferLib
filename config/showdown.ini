[base]
package = ocean
env_name = showdown
policy_name = Showdown
rnn_name = ShowdownLSTM
max_suggestion_cost = 3600

[vec]
backend = Multiprocessing
num_envs = 4
num_workers = auto
batch_size = auto
zero_copy = True
seed = 42

[env]
num_envs = 1024
num_agents = 1
[policy]
hidden_size = 512
[rnn]
input_size = 512
hidden_size = 512

[train]
name = pufferai
project = ablations
use_rnn = True
seed = 42
torch_deterministic = True
cpu_offload = False
device = cuda
optimizer = muon
anneal_lr = True
precision = float32
total_timesteps = 4.999999999999989e+07
learning_rate = 0.03362164077422456
gamma = 0.9991485137137409
gae_lambda = 0.5999999999999999
update_epochs = 1
clip_coef = 0.6032039733147699
vf_coef = 0.23186870237113577
vf_clip_coef = 3.451044454872336
max_grad_norm = 1.544659028596039
ent_coef = 0.00017037159811919756
adam_beta1 = 0.4999999999999999
adam_beta2 = 0.9997529346062048
adam_eps = 2.4474388294132323e-07

data_dir = experiments
checkpoint_interval = 200
batch_size = auto
minibatch_size = 65536

# Accumulate gradients above this size
max_minibatch_size = 32768
bptt_horizon = 64
compile = False
compile_mode = reduce-overhead
compile_fullgraph = True

vtrace_rho_clip = 0.3986568475548824
vtrace_c_clip = 0.3303897066258099

prio_alpha = 0.8104476366360136
prio_beta0 = 0.9502007904234925

[sweep]
method = Protein 
metric = score
goal = maximize
downsample = 10

# TODO: Elim from base
[sweep.train.total_timesteps]
distribution = log_normal
min = 5e7
max = 1e9
mean = 1e8
scale = time

[sweep.train.bptt_horizon]
distribution = uniform_pow2
min = 16
max = 64
mean = 64
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 8192
max = 65536
mean = 32768
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00001
mean = 0.01
max = 0.1
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
mean = 0.01
max = 0.2
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.8
mean = 0.98
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.6
mean = 0.95
max = 0.995
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 0.0
max = 5.0
mean = 1.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 0.0
max = 5.0
mean = 1.0
scale = auto

#[sweep.train.update_epochs]
#distribution = int_uniform
#min = 1
#max = 8
#mean = 1
#scale = 2.0

[sweep.train.clip_coef]
distribution = uniform
min = 0.01
max = 1.0
mean = 0.2
scale = auto

# Optimal vf clip can be lower than 0.1,
# but this results in jank unstable runs
[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.1
max = 5.0
mean = 0.2
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.0
max = 5.0
mean = 2.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.0
mean = 1.0
max = 5.0
scale = auto

[sweep.train.adam_beta1]
distribution = logit_normal
min = 0.5
mean = 0.9
max = 0.999
scale = auto

[sweep.train.adam_beta2]
distribution = logit_normal
min = 0.9
mean = 0.999
max = 0.99999
scale = auto

[sweep.train.adam_eps]
distribution = log_normal
min = 1e-14
mean = 1e-8
max = 1e-4
scale = auto

[sweep.train.prio_alpha]
distribution = logit_normal
min = 0.1
mean = 0.85
max = 0.99
scale = auto

[sweep.train.prio_beta0]
distribution = logit_normal
min = 0.1
mean = 0.85
max = 0.99
scale = auto
