[base]
env_name = showdown
wandb_project = showdown
wandb_group = showdown_2v2_sweep_v4

; [vec]
; total_agents = 4096
; num_buffers = 2
; num_threads = 32

[env]
num_agents = 1
min_gametype = 0
gametype_limit = 4
opp_type = 3
invalid_penalty = 0.01
weight_1v1 = 1.0
weight_2v2 = 1.0
weight_6v6 = 1.0
weight_ou = 1.0
selfplay_opponent_prob = 0.0

[policy]
hidden_size = 512
num_layers = 4

[torch]
network = MinGRU
encoder = ShowdownEncoder
decoder = ShowdownDecoder

[train]
total_timesteps = 73_731_639
learning_rate = 0.0017141038344903475
anneal_lr = 1
min_lr_ratio = 0.1
gamma = 0.9997387005778752
gae_lambda = 0.9831025036433848
clip_coef = 0.3782979313143792
vf_coef = 2.0
vf_clip_coef = 1.296799326652585
max_grad_norm = 1.2638356988987929
ent_coef = 0.02
beta1 = 0.9647736562757993
beta2 = 0.99970337683275
eps = 1.395650310762596e-09
minibatch_size = 16384
horizon = 32
vtrace_rho_clip = 0.5
vtrace_c_clip = 0.5
prio_alpha = 0.3139123972557133
prio_beta0 = 0.4809897968601189
replay_ratio = 1.7389268684611905

[sweep]
method = Protein
metric = perf
metric_distribution = linear
goal = maximize
max_suggestion_cost = 7200
max_runs = 30
gpus = 1
downsample = 10
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.3
; sweep_only = train  ; removed: pufferlib filter is broken for nested sections; all sweep ranges here are already train-only
; total_timesteps is pinned to a tight band below (config/default.ini defines a much
; wider [sweep.train.total_timesteps] range that would otherwise still apply via
; inheritance - configparser section overrides can't "unset" an inherited section).
; Every trial costs ~the same (~1min) so comparisons are apples-to-apples.

[sweep.train.total_timesteps]
distribution = log_normal
min = 59000000
max = 61000000
scale = time

[sweep.env.invalid_penalty]
distribution = log_normal
min = 0.005
max = 0.2
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 128
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 8192
max = 65536
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.001
max = 0.02
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0001
max = 0.05
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.99
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.7
max = 0.99
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 0.5
max = 3.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 0.5
max = 3.0
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.05
max = 0.5
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.2
max = 3.0
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.1
max = 2.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.1
max = 3.0
scale = auto

[sweep.train.beta1]
distribution = logit_normal
min = 0.8
max = 0.99
scale = auto

[sweep.train.beta2]
distribution = logit_normal
min = 0.95
max = 0.9999
scale = auto

[sweep.train.eps]
distribution = log_normal
min = 1e-10
max = 1e-5
scale = auto

[sweep.train.prio_alpha]
distribution = uniform
min = 0.1
max = 0.9
scale = auto

[sweep.train.prio_beta0]
distribution = uniform
min = 0.1
max = 0.9
scale = auto
